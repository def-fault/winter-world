<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINTER WORLD · 스프라이트 작업실</title><link rel="stylesheet" href="style.css"><style>.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:25px 0}.toolbar select{width:180px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.preview{background:#142232;border:1px solid #344658;padding:14px}.preview canvas{width:100%;background:repeating-conic-gradient(#192a3a 0% 25%,#1c3041 0% 50%) 50%/24px 24px}.preview h2{font-size:16px}.preview p{font-size:11px;color:#9bb0c2}.preview a{color:#aeeadd;font-size:11px}input{accent-color:#aeeadd}#readout{color:#9fb0be;font-size:12px}</style></head><body><header><a href="index.html" class="brand">W / W</a><span class="edition">SPRITE LAB / 176 POSES</span><a href="index.html" class="quiet">게임으로 돌아가기</a></header><main><div class="eyebrow">FRAME ANIMATION / 7 FIGHTERS / 4 TRANSFORMATIONS</div><h1>스프라이트 작업실</h1><p>캐릭터별 전투 자세와 애니메이션을 확인하세요.</p><p><a class="quiet" href="assets/forms/fencing-devil.png">펜싱 데빌 완성 일러스트 ↗</a></p><p><a class="quiet" href="heights.html">전체 키 비교 보기 ↗</a></p><div class="toolbar"><select id="action"><option value="idle">대기</option><option value="walk">이동</option><option value="light">약공격</option><option value="heavy">강공격</option><option value="special">특수기</option><option value="guard">방어</option><option value="jump">점프</option><option value="hurt">피격</option><option value="ko">다운</option><option value="all">전체 16프레임</option></select><button id="play" class="quiet">정지</button><button id="flip" class="quiet">방향 전환</button><label>속도 <input id="speed" type="range" min="0.25" max="2" step=".25" value="1"></label><span id="readout"></span></div><div class="grid" id="grid"></div></main><script src="engine.js?v=forms-4"></script><script src="assets/sprites/atlas.js"></script><script src="assets/sprites/golem-atlas.js"></script><script src="assets/sprites/slime-atlas.js"></script><script src="assets/sprites/angel-atlas.js"></script><script src="assets/sprites/devil-atlas.js"></script><script src="animation.js?v=forms-4"></script><script>
'use strict';
const grid=document.getElementById('grid'),action=document.getElementById('action');let playing=true,face=1,time=0,last=0;
const sources=[...WinterFight.roster.map((c,i)=>({c,src:`assets/sprites/fighter-${i}.png`,atlas:SPRITE_ATLASES[i]})),...[[0,'atomic-golem',GOLEM_ATLAS],[2,'bullet-angel',ANGEL_ATLAS],[6,'nitro-slime',SLIME_ATLAS],[3,'fencing-devil',DEVIL_ATLAS]].map(([id,file,atlas])=>({c:WinterFight.forms[id],src:`assets/sprites/${file}.png`,atlas}))];
const entries=sources.map(({c,src,atlas})=>{const article=document.createElement('article');article.className='preview';article.innerHTML=`<canvas width="360" height="340"></canvas><h2>${c.name}</h2><p>${c.skill} · 키 비율 ${c.heightUnits} · 16개의 개별 자세</p><a href="${src}" target="_blank">원본 스프라이트 시트 보기 ↗</a>`;grid.append(article);const im=new Image();im.src=src;return{ctx:article.querySelector('canvas').getContext('2d'),im,c,atlas};});
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'정지':'재생';};document.getElementById('flip').onclick=()=>face*=-1;action.onchange=()=>time=0;
function frame(now){if(playing)time+=Math.min(.05,(now-last)/1000||0)*Number(document.getElementById('speed').value);last=now;const a=action.value;const f={hp:100,animTime:time};if(['light','heavy','special'].includes(a)){const duration=a==='light'?.32:a==='heavy'?.48:.55;const t=time%(duration+.35);if(t<duration)f.attack={kind:a,t};}if(a==='walk')f.moving=true;if(a==='guard')f.guard=true;if(a==='hurt')f.stun=1;if(a==='ko')f.hp=0;if(a==='jump'){const t=time%1.3;f.y=Math.max(0,240*t-300*t*t);f.vy=t<.12?600:0;if(t>.8&&t<.9)f.landing=1;}
const pose=a==='all'?Math.floor(time*5)%16:FighterAnimation.pose(f);document.getElementById('readout').textContent=`FRAME ${String(pose+1).padStart(2,'0')} / 16`;
entries.forEach(({ctx,im,c,atlas})=>{ctx.clearRect(0,0,360,340);ctx.fillStyle='#92aab3';ctx.fillRect(12,305,336,1);if(im.complete&&im.naturalWidth)FighterAnimation.draw(ctx,im,atlas,pose,180,305-(f.y||0),Math.min(c.height*.88,260),face);});requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
